<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balloon Pop Carnival</title>
<style>
:root{--ink:#49304d;--pink:#ef5275;--gold:#ffc95c;--blue:#6ac8ed;--cream:#fff8e9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 10%,#fff8e9,#bdeaff 72%);display:flex;justify-content:center;align-items:center;padding:18px}
.app{width:min(1120px,100%);background:#fffaf0;border:5px solid #fff;border-radius:26px;box-shadow:0 18px 55px #49304d30;overflow:hidden}
header{text-align:center;padding:18px 12px 12px;background:linear-gradient(90deg,#ed5574,#ff9d63,#ed5574);color:white;text-shadow:0 3px 0 #a93d62}h1{margin:0;font-size:clamp(23px,4vw,38px);letter-spacing:1px}header p{margin:5px 0 0;font-weight:600}
.stage-wrap{padding:12px;background:#fff3db}.stage{position:relative;width:100%;aspect-ratio:1100/720;min-height:300px;border-radius:17px;overflow:hidden;background:#9cdbff;box-shadow:inset 0 0 0 3px #fff}canvas{display:block;width:100%;height:100%}
.controls{padding:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;background:#fffaf0}.entry-area{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.8fr);gap:12px;align-items:stretch}.single-entry,.bulk-entry{min-width:0}.single-entry{display:flex;gap:8px;align-items:flex-start}.bulk-entry{display:flex;flex-direction:column;gap:7px}input,textarea{width:100%;font:inherit;border:2px solid #e9c6a8;border-radius:12px;padding:12px 14px;outline:none;background:white;color:var(--ink)}textarea{resize:vertical;min-height:100px}input:focus,textarea:focus{border-color:#ed7090;box-shadow:0 0 0 3px #ed709033}.bulk-entry label{font-size:13px;font-weight:700;color:#806b79}
button{font:700 15px system-ui,sans-serif;border:0;border-radius:12px;padding:12px 18px;color:white;cursor:pointer;box-shadow:0 4px 0 #0002;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.add{background:#35a879}.bulk{background:#279b8b}.start,.next{background:#3988d8}.pop{background:#e94f75}.reset{background:#7b8195}.music{background:#8058a8}.hint{text-align:center;color:#806b79;font-size:13px;padding:0 12px 14px;margin:0}.control-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}.small-note{font-size:12px;color:#8a7782;margin:0}
@media(max-width:650px){body{padding:6px}.app{border-width:3px;border-radius:18px}.stage-wrap{padding:7px}.controls{padding:12px}.entry-area{grid-template-columns:1fr}.single-entry{flex-direction:column}.single-entry button{width:100%}.control-row button{flex:1 1 40%}}
</style></head>
<body><main class="app"><header><h1>🎪 BALLOON POP CARNIVAL 🎈</h1><p>Pop a balloon and discover who's the lucky one!</p></header>
<div class="stage-wrap"><div class="stage"><canvas id="game" width="1100" height="720" aria-label="Balloon Pop Carnival game"></canvas></div></div>
<section class="controls" id="controls">
  <div class="entry-area" id="entryArea">
    <div class="single-entry"><input id="nameInput" maxlength="40" placeholder="Type one name and press Enter" autocomplete="off"><button class="add" id="addBtn">ADD NAME</button></div>
    <div class="bulk-entry"><label for="bulkInput">PASTE A WHOLE CLASS LIST (one name per line)</label><textarea id="bulkInput" placeholder="Example:\nAna Santos\nBen Cruz\nCarla Reyes"></textarea><button class="bulk" id="bulkBtn">ADD ALL NAMES</button><p class="small-note">You can paste names copied from Excel or Google Sheets.</p></div>
  </div>
  <div class="control-row"><button class="start" id="startBtn" disabled>START GAME</button><button class="pop" id="popBtn" hidden>POP A BALLOON</button><button class="next" id="nextBtn" hidden>NEXT ROUND</button><button class="reset" id="resetBtn" hidden>RESET</button><button class="music" id="musicBtn" aria-pressed="false">♫ MUSIC: OFF</button></div>
</section><p class="hint" id="hint">Add up to 40 names. Names stay secret inside the balloons!</p></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const input=document.getElementById('nameInput'),bulkInput=document.getElementById('bulkInput'),addBtn=document.getElementById('addBtn'),bulkBtn=document.getElementById('bulkBtn'),startBtn=document.getElementById('startBtn'),popBtn=document.getElementById('popBtn'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn'),musicBtn=document.getElementById('musicBtn'),entryArea=document.getElementById('entryArea'),hint=document.getElementById('hint');
const W=1100,H=720,MAX_NAMES=40,colors=['#ff5d7a','#ffb74d','#5cbeff','#ae7dff','#5bd39e','#ff82d2','#ffdc5c'];
let names=[],balloons=[],particles=[],phase='input',winner='',target=null,dart=null,revealAt=0,last=0,elapsed=0,audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function updateControls(){startBtn.disabled=names.length===0;hint.textContent=`${names.length} / ${MAX_NAMES} names added. Names stay secret inside the balloons!`;}
function cleanNames(text){return text.split(/[\r\n,;\t]+/).map(s=>s.trim()).filter(Boolean);}
function addOne(){const n=input.value.trim();if(!n)return;const room=MAX_NAMES-names.length;if(room<=0){hint.textContent=`The limit is ${MAX_NAMES} names.`;return;}names.push(n.slice(0,40));input.value='';updateControls();}
function addMany(){const incoming=cleanNames(bulkInput.value);if(!incoming.length){hint.textContent='Paste or type a list of names first.';return;}const room=MAX_NAMES-names.length;const accepted=incoming.slice(0,Math.max(0,room)).map(n=>n.slice(0,40));names.push(...accepted);bulkInput.value='';updateControls();const skipped=incoming.length-accepted.length;hint.textContent=skipped?`${accepted.length} names added. ${skipped} skipped because the ${MAX_NAMES}-name limit was reached.`:`Added ${accepted.length} names! You now have ${names.length} names.`;}
addBtn.onclick=addOne;bulkBtn.onclick=addMany;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addOne();}});
function build(){balloons=[];const count=names.length,cols=count<=8?4:8,xGap=count<=8?170:94,yGap=count<=8?165:66,startX=count<=8?430:365,startY=count<=8?330:285,r=count<=8?37:28;names.forEach((name,i)=>{const row=Math.floor(i/cols),col=i%cols;balloons.push({name,x:startX+col*xGap+(row%2)*8,y:startY+row*yGap,color:colors[i%colors.length],phase:i*.73,popped:false,r});});}
function showGame(){phase='game';build();entryArea.hidden=true;startBtn.hidden=true;popBtn.hidden=resetBtn.hidden=false;nextBtn.hidden=true;popBtn.disabled=false;}
startBtn.onclick=()=>{if(names.length)showGame();};
function reset(){names=[];balloons=[];particles=[];winner='';target=null;dart=null;phase='input';entryArea.hidden=false;startBtn.hidden=popBtn.hidden=nextBtn.hidden=resetBtn.hidden=true;startBtn.disabled=true;input.value='';bulkInput.value='';updateControls();}
resetBtn.onclick=reset;
function next(){if(!names.length){reset();return;}showGame();}
nextBtn.onclick=next;
function shoot(){if(phase!=='game'||dart||!names.length)return;const choices=balloons.filter(b=>!b.popped);if(!choices.length)return;target=choices[Math.floor(Math.random()*choices.length)];dart={x:220,y:445,progress:0,startX:220,startY:445,endX:target.x,endY:target.y};popBtn.disabled=true;hint.textContent='The dart is on its way...';}
popBtn.onclick=shoot;
// Original synthesized carnival soundtrack and effects (no external audio files required).
function ensureAudio(){if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function tone(freq,start,duration,type='sine',volume=.08,when=0){const ac=ensureAudio();if(!ac)return;const osc=ac.createOscillator(),gain=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,ac.currentTime+when);gain.gain.setValueAtTime(.0001,ac.currentTime+when);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),ac.currentTime+when+.025);gain.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+when+duration);osc.connect(gain);gain.connect(ac.destination);osc.start(ac.currentTime+when);osc.stop(ac.currentTime+when+duration+.04);}
const melody=[659,784,880,784,659,523,587,659,784,659,587,523,587,659,784,880];
function musicTick(){if(!musicOn||!audioCtx)return;const note=melody[musicStep%melody.length],t=0;tone(note,0,.22,'triangle',.035,t);if(musicStep%4===0)tone(note/2,0,.34,'sine',.045,t);if(musicStep%4===2)tone(392,0,.12,'sine',.018,t);musicStep++;}
function setMusic(on){musicOn=on;musicBtn.textContent=on?'♫ MUSIC: ON':'♫ MUSIC: OFF';musicBtn.setAttribute('aria-pressed',String(on));if(on){ensureAudio();if(!musicTimer){musicStep=0;musicTick();musicTimer=setInterval(musicTick,300);}}else if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
musicBtn.onclick=()=>setMusic(!musicOn);
function playPop(){// short airy pop + descending pluck
const ac=ensureAudio();if(!ac)return;const buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*.12),ac.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=1500;gain.gain.setValueAtTime(.18,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start();tone(520,0,.16,'sine',.045);}
function playReveal(){// cheerful original three-note carnival fanfare
[523,659,784,1047].forEach((f,i)=>tone(f,0,.42,'triangle',.075,i*.13));tone(262,0,.65,'sine',.045,.02);}
function rr(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function drawBackground(t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bd5ff');g.addColorStop(1,'#e5f7ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#8bd69b';ctx.fillRect(0,625,W,95);ctx.fillStyle='#70c985';for(let i=0;i<14;i++){ctx.beginPath();ctx.arc(i*95,635,55,Math.PI,0);ctx.fill();}
ctx.fillStyle='#e94f70';ctx.fillRect(0,0,W,125);for(let i=0;i<11;i++){ctx.fillStyle=i%2?'#fff4df':'#e94f70';ctx.fillRect(i*110,0,55,125);}for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#fff4df':'#e94f70';ctx.beginPath();ctx.ellipse(i*100+25,119,53,20,0,0,Math.PI*2);ctx.fill();}
ctx.strokeStyle='#604b60';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<5;i++){let x=i*275,y=148+Math.sin(i*1.5)*10;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();const lc=['#ffe56c','#ff8aa4','#8ef0ce','#c5a2ff'];for(let i=0;i<13;i++){let x=25+i*88,y=148+Math.sin(i*.7)*10;ctx.shadowBlur=15;ctx.shadowColor=lc[i%4];ctx.fillStyle=lc[i%4];ctx.beginPath();ctx.arc(x,y,8+Math.sin(t*3+i)*1.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
const fc=['#ff6581','#ffcf5e','#66c9f2','#6ed5a0'];for(let i=0;i<9;i++){let x=35+i*125;ctx.fillStyle=fc[i%4];ctx.beginPath();ctx.moveTo(x,166);ctx.lineTo(x+38,166);ctx.lineTo(x+19,197);ctx.closePath();ctx.fill();}for(let i=0;i<4;i++){let x=65+i*300,y=260+(i%2)*70;ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.arc(x,y,27,0,7);ctx.arc(x+28,y-10,34,0,7);ctx.arc(x+60,y,25,0,7);ctx.fill();}}
function drawBalloon(b,t){const bob=Math.sin(t*1.5+b.phase)*11,sway=Math.sin(t*.8+b.phase)*7,x=b.x+sway,y=b.y+bob,r=b.r,scale=r/43;ctx.save();ctx.translate(x,y);ctx.scale(.82*scale,1.08*scale);ctx.shadowColor='#48627a55';ctx.shadowBlur=13*scale;ctx.shadowOffsetX=7*scale;ctx.shadowOffsetY=9*scale;const g=ctx.createRadialGradient(-18,-24,3,8,5,53);g.addColorStop(0,'#ffffff');g.addColorStop(.16,b.color);g.addColorStop(.78,b.color);g.addColorStop(1,'#58445d');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,43,43,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-18,-22,6,15,-.35,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(-23,-31,4,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(x-6*scale,y+45*scale);ctx.lineTo(x+6*scale,y+45*scale);ctx.lineTo(x,y+56*scale);ctx.closePath();ctx.fill();ctx.strokeStyle='#788b9a';ctx.lineWidth=Math.max(1,1.5*scale);ctx.beginPath();ctx.moveTo(x,y+55*scale);ctx.bezierCurveTo(x+12*scale,y+70*scale,x-10*scale,y+80*scale,x-2*scale,y+96*scale);ctx.stroke();}
function drawKid(){ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(124,545,65,12,0,0,7);ctx.fill();const body=ctx.createRadialGradient(96,465,5,125,490,65);body.addColorStop(0,'#ffe18c');body.addColorStop(1,'#ed982b');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(120,490,49,60,0,0,7);ctx.fill();ctx.fillStyle='#e9a779';ctx.fillRect(111,421,25,30);ctx.fillStyle='#e8a27c';ctx.beginPath();ctx.arc(91,395,12,0,7);ctx.arc(161,395,12,0,7);ctx.fill();const skin=ctx.createRadialGradient(113,370,5,128,395,48);skin.addColorStop(0,'#ffe0bd');skin.addColorStop(1,'#e9a779');ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(126,394,40,46,0,0,7);ctx.fill();ctx.fillStyle='#57321f';ctx.beginPath();ctx.ellipse(126,365,42,27,0,Math.PI,Math.PI*2);ctx.fill();for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(94+i*20,355+(i%2)*-7,14,0,7);ctx.fill();}for(const x of [112,140]){ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(x,390,6,8,0,0,7);ctx.fill();ctx.fillStyle='#392b29';ctx.beginPath();ctx.arc(x+1,392,3.5,0,7);ctx.fill();}ctx.fillStyle='#ed8b91';for(const x of [100,151]){ctx.beginPath();ctx.arc(x,410,7,0,7);ctx.fill();}ctx.strokeStyle='#8d4f49';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(127,407,11,.2,Math.PI-.2);ctx.stroke();const tube=ctx.createLinearGradient(150,410,150,430);tube.addColorStop(0,'#f3d18b');tube.addColorStop(.45,'#a8753d');tube.addColorStop(1,'#70471f');rr(153,414,112,15,6,tube);ctx.fillStyle='#70471f';ctx.fillRect(253,412,7,19);ctx.fillStyle='#ffe0a0';ctx.fillRect(159,416,88,3);}
function drawDart(){if(!dart)return;const p=dart.progress,x=dart.startX+(dart.endX-dart.startX)*p,y=dart.startY+(dart.endY-dart.startY)*p;ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(dart.endY-dart.startY,dart.endX-dart.startX));ctx.fillStyle='#5d5147';ctx.fillRect(-19,-2,31,4);ctx.fillStyle='#d7dce0';ctx.beginPath();ctx.moveTo(12,-5);ctx.lineTo(23,0);ctx.lineTo(12,5);ctx.fill();ctx.restore();}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}ctx.globalAlpha=1;}
function draw(){const t=elapsed;drawBackground(t);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 34px system-ui';ctx.shadowColor='#853c60';ctx.shadowBlur=3;ctx.fillText('BALLOON POP CARNIVAL',550,235);ctx.shadowBlur=0;if(phase==='input'){ctx.fillStyle='#4e5572';ctx.font='600 23px system-ui';ctx.fillText('Add the names, then let the carnival choose!',550,300);ctx.fillText(`Names added: ${names.length} / ${MAX_NAMES}`,550,355);ctx.font='18px system-ui';names.slice(0,12).forEach((n,i)=>{const x=300+(i%4)*170,y=405+Math.floor(i/4)*48;rr(x-75,y-18,150,35,10,'#fffaf0');ctx.fillStyle='#55445b';ctx.fillText(`${i+1}. ${n}`,x,y+6);});if(names.length>12){ctx.fillStyle='#806b79';ctx.font='16px system-ui';ctx.fillText(`and ${names.length-12} more names...`,550,570);}}
else{ctx.textAlign='left';ctx.fillStyle='#49304d';ctx.font='bold 21px system-ui';ctx.fillText(`Names remaining: ${names.length}`,28,270);balloons.forEach(b=>{if(!b.popped)drawBalloon(b,t);});drawKid();drawDart();drawParticles();if(phase==='suspense'||phase==='reveal'){rr(270,300,560,210,25,'rgba(255,250,240,.95)');ctx.textAlign='center';if(phase==='suspense'){const pulse=1+Math.sin(t*9)*.035;ctx.save();ctx.translate(550,390);ctx.scale(pulse,pulse);ctx.fillStyle='#e84f76';ctx.font='900 38px system-ui';ctx.fillText('WHO WILL IT BE?',0,0);ctx.restore();ctx.fillStyle='#806b79';ctx.font='20px system-ui';ctx.fillText('The carnival is choosing...',550,440);}else{const s=Math.min(1,(t-revealAt)*2.5);ctx.fillStyle='#62556b';ctx.font='bold 25px system-ui';ctx.fillText('THE PICKED NAME IS',550,365);ctx.save();ctx.translate(550,430);ctx.scale(.5+.5*s,.5+.5*s);ctx.fillStyle='#e84f76';ctx.font='900 48px system-ui';ctx.fillText(winner,0,0);ctx.restore();ctx.fillStyle='#62556b';ctx.font='19px system-ui';ctx.fillText(`Remaining names: ${names.length}`,550,475);}}}}
function frame(now){const dt=Math.min((now-last)/1000||0,.05);last=now;elapsed+=dt;if(dart){dart.progress+=dt*2.5;if(dart.progress>=1){dart=null;if(target){target.popped=true;winner=target.name;playPop();const cx=target.x,cy=target.y;for(let i=0;i<36;i++){const a=i*Math.PI*2/36,s=rand(90,220);particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:target.color,r:rand(3,7)});}const index=names.indexOf(winner);if(index!==-1)names.splice(index,1);phase='suspense';revealAt=elapsed;popBtn.disabled=false;popBtn.hidden=true;nextBtn.hidden=true;hint.textContent='The carnival is choosing...';}}}if(phase==='suspense'&&elapsed-revealAt>=1.6){phase='reveal';revealAt=elapsed;playReveal();nextBtn.hidden=false;nextBtn.textContent=names.length?'NEXT ROUND':'FINISH';hint.textContent='The surprise has been revealed!';}particles.forEach(p=>{p.life-=dt*1.3;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;});particles=particles.filter(p=>p.life>0);draw();requestAnimationFrame(frame);}
updateControls();requestAnimationFrame(frame);
})();
</script></body></html>
